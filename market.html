<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Buy, sell and give things away across the Philippines.">
<title>Marketplace | Philippines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14213d;--mute:#5b6479;--line:#e2e6f0;--pri:#1a56db;--onpri:#fff;--acc:#f5a400;--red:#d62839;--ok:#15803d;--soft:#e8efff;--shadow:0 1px 2px rgba(20,33,61,.05),0 8px 24px rgba(20,33,61,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#161e33;--ink:#eaf0ff;--mute:#9aa6c4;--line:#263152;--pri:#6ea0ff;--onpri:#08122b;--acc:#ffc233;--red:#ff6b7a;--ok:#4ade80;--soft:#1d2a4d;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
a{color:var(--pri)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:6px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:1.15rem;margin-right:auto;letter-spacing:-.02em}
.brand small{display:block;font-weight:400;font-size:.68rem;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;line-height:1}
.brand svg{width:34px;height:34px}
#nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nl{font:inherit;font-weight:600;font-size:.9rem;color:var(--ink);background:transparent;border:0;text-decoration:none;padding:8px 12px;border-radius:10px;cursor:pointer;position:relative}
.nl:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--pri);background:var(--pri);color:var(--onpri);border-radius:12px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--pri)}
.btn.bad{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.lnk{font:inherit;background:none;border:0;color:var(--pri);text-decoration:underline;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{padding-top:22px;padding-bottom:90px;min-height:70vh}
.hero h1{font-size:clamp(2rem,6vw,3rem);font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:8px 0 6px}
.hero p{color:var(--mute);margin:0 0 18px;font-size:1.05rem}
.note-bar{background:color-mix(in srgb,var(--acc) 18%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:14px;padding:10px 16px;font-size:.9rem;margin-bottom:14px}
.off{display:none;background:var(--red);color:#fff;text-align:center;padding:6px;font-size:.88rem;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.search:focus-within{border-color:var(--pri)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 0;outline:none;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;max-width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--pri)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.cat{font:inherit;font-weight:600;font-size:.88rem;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}

details.more{margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;position:relative}

.mt{color:var(--mute);font-size:.78rem}
.tag{display:inline-block;font-size:.74rem;font-weight:600;background:var(--soft);color:var(--pri);border-radius:999px;padding:2px 10px;margin:0 6px 6px 0}

.center{text-align:center;padding:16px 0}
.none{text-align:center;color:var(--mute);padding:50px 10px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.chk input{width:auto!important;margin-top:4px}

.note{color:var(--mute);font-size:.86rem}

.gal .main{aspect-ratio:1;border-radius:20px;overflow:hidden;background:linear-gradient(140deg,var(--soft),color-mix(in srgb,var(--pri) 20%,var(--card)));display:grid;place-items:center;cursor:zoom-in;border:1.5px solid var(--line)}

.mine{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}

.mine .tt{flex:1;min-width:150px}
.inbox a.row{display:flex;gap:12px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.inbox a.row:first-child{border-top:0}
.inbox .tt{flex:1;min-width:0}
.inbox .tt b,.inbox .tt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pri);flex:none}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.chead{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chead .th{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:1.5rem;flex:none}
.chead .th img{width:100%;height:100%;object-fit:cover}
.msgs{flex:1;overflow-y:auto;padding:14px 4px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.b .tm{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
.b.pend{opacity:.6}
.b.fail{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--ink)}
.day{align-self:center;font-size:.72rem;color:var(--mute);margin:8px 0}
.compose{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.compose textarea{flex:1;min-height:46px;max-height:120px;margin:0;border-radius:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.quick button{font:inherit;font-size:.82rem;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.quick button:hover{border-color:var(--pri)}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,12,28,.6);backdrop-filter:blur(3px)}
.dp{padding:22px}
.dp h2{margin:0 0 6px;font-size:1.3rem}
.zoom{width:min(900px,96vw)}
.zoom img{width:100%;max-height:86vh;object-fit:contain;display:block;background:#000;border-radius:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{padding-bottom:30px;color:var(--mute);font-size:.84rem;text-align:center}
ul.rules{padding-left:20px}ul.rules li{margin:6px 0}
.sp{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
const C=window.MARKET_CONFIG||{};
const BASE=String(C.url||"").trim().replace(/\/+$/,""),KEY=String(C.key||"").trim();
const READY=/^https:\/\/\S+$/.test(BASE)&&KEY.length>20;
let DEMO=false;if(!READY){try{DEMO=sessionStorage.getItem("mk-demo")==="1"||/[?&]demo\b/.test(location.search)}catch(e){}}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const peso=n=>Number(n)===0?"Free":"₱"+Number(n).toLocaleString("en-PH",{maximumFractionDigits:2});
const ago=iso=>{const s=(Date.now()-new Date(iso))/1000;if(!(s>=60))return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";if(s<2592000)return Math.floor(s/86400)+" d ago";return new Date(iso).toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"})};
const uuid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
const UUIDRE=/^[0-9a-f-]{36}$/i;
const qv=s=>encodeURIComponent(s);
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)};
const CATS=[["Electronics","💻"],["Mobile phones","📱"],["Home and furniture","🛋️"],["Clothing and shoes","👕"],["Books and school","📚"],["Sewing and fabric","🧵"],["Tools","🔧"],["Plants and food","🌱"],["Toys and baby","🧸"],["Sports","⚽"],["Pet supplies","🐾"],["Other","🛍️"]];
const emoOf=c=>(CATS.find(x=>x[0]===c)||CATS[11])[1];
const REGIONS=["NCR (Metro Manila)","CAR (Cordillera)","Region I (Ilocos)","Region II (Cagayan Valley)","Region III (Central Luzon)","Region IV-A (CALABARZON)","MIMAROPA","Region V (Bicol)","Region VI (Western Visayas)","Region VII (Central Visayas)","Region VIII (Eastern Visayas)","Region IX (Zamboanga Peninsula)","Region X (Northern Mindanao)","Region XI (Davao)","Region XII (SOCCSKSARGEN)","Region XIII (Caraga)","BARMM"];
const regOpts=(sel,ph)=>`<option value="">${esc(ph)}</option>`+REGIONS.map(r=>`<option${r===sel?" selected":""}>${esc(r)}</option>`).join("");
const pub=p=>BASE+"/storage/v1/object/public/listing-photos/"+String(p).split("/").map(encodeURIComponent).join("/");
const view=$("#view");
if(C.contact)$("#contact").innerHTML=` · Report a problem: <a href="mailto:${esc(C.contact)}">${esc(C.contact)}</a>`;

/* ================= session + network ================= */
class HttpError extends Error{constructor(m,status,code){super(m);this.status=status;this.code=code}}
const SK="mk-session-v1";let sess=null,me=null,unreadCount=0;
try{sess=JSON.parse(localStorage.getItem(SK))}catch(e){}
if(sess&&!(sess.access_token&&sess.user&&sess.user.id))sess=null;
function setSession(s){
 if(s&&s.access_token){sess={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600),user:s.user?{id:s.user.id,email:s.user.email}:(sess&&sess.user)};try{localStorage.setItem(SK,JSON.stringify(sess))}catch(e){}}
 else{sess=null;me=null;unreadCount=0;try{localStorage.removeItem(SK)}catch(e){}}
 renderHeader()}
const friendly=m=>{m=String(m||"");const l=m.toLowerCase();
 if(l.includes("invalid login"))return"Wrong email or password.";
 if(l.includes("not confirmed"))return"Please confirm your email first. Check your inbox.";
 if(l.includes("already registered")||l.includes("already been registered"))return"That email already has an account. Try logging in.";
 if(l.includes("rate limit")||l.includes("too many"))return"Too many tries. Please wait a few minutes and try again.";
 if(l.includes("password")&&l.includes("least"))return"Password must be at least 8 characters.";
 if(l.includes("row-level security")||l.includes("permission denied"))return"You are not allowed to do that.";
 if(l.includes("duplicate key"))return"That already exists.";
 return m};
async function authReq(path,method,body,tok){
 const h={apikey:KEY,"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;
 let r;try{r=await fetch(BASE+path,{method,headers:h,body:body?JSON.stringify(body):undefined})}catch(e){throw new HttpError("No internet connection. Please try again.",0)}
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw new HttpError(friendly((j&&(j.msg||j.error_description||j.message))||("Error "+r.status)),r.status,j&&(j.error_code||j.code));
 return j}
let refreshP=null;
function refreshSession(){
 if(!sess)return Promise.reject(new Error("no session"));if(refreshP)return refreshP;
 refreshP=(async()=>{try{setSession(await authReq("/auth/v1/token?grant_type=refresh_token","POST",{refresh_token:sess.refresh_token}))}catch(e){if(e.status>=400&&e.status<500)setSession(null);throw e}finally{refreshP=null}})();return refreshP}
async function http(path,o={}){
 const method=o.method||"GET",auth=o.auth!==false,tries=o.retry===undefined?(method==="GET"?3:1):(o.retry?3:1);let last;
 for(let i=0;i<tries;i++){
  try{
   if(auth&&sess&&sess.expires_at-Date.now()/1000<45){try{await refreshSession()}catch(e){if(!sess)throw new HttpError("Please log in again.",401)}}
   const h={apikey:KEY,...(o.headers||{})};
   const tok=auth&&sess?sess.access_token:(KEY.startsWith("eyJ")?KEY:null);if(tok)h.Authorization="Bearer "+tok;
   let body=o.body;if(body!==undefined&&!(body instanceof Blob)){h["Content-Type"]="application/json";body=JSON.stringify(body)}
   let r;try{r=await fetch(BASE+path,{method,headers:h,body})}catch(e){throw new Error("No internet connection. Please try again.")}
   if(r.status===401&&auth&&sess&&!o._r){try{await refreshSession()}catch(e){}if(sess)return http(path,{...o,_r:1});throw new HttpError("Please log in again.",401)}
   if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw new HttpError(friendly(e.message||e.msg||e.error_description||e.error||("Error "+r.status)),r.status,e.code||e.error_code)}
   if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null;
  }catch(err){last=err;if(err instanceof HttpError&&err.status<500)throw err;if(i<tries-1)await sleep(500*(i+1))}
 }
 throw last}
const qs=a=>a.map(x=>x[0]+"="+(x[1]===undefined?"":qv(x[1]))).join("&");

/* ================= auth ================= */
async function loadMe(){
 if(!sess)return;
 try{const r=await http("/rest/v1/profiles?id=eq."+sess.user.id+"&select=*");me=r&&r[0]?r[0]:null}catch(e){if(e.status===401)return}
 if(!me)me={id:sess.user.id,display_name:(sess.user.email||"Me").split("@")[0],region:"",city:""};
 renderHeader()}
async function takeAuthHash(){
 const h=location.hash;if(!/access_token=|error_description=/.test(h))return;
 const p=new URLSearchParams(h.replace(/^#\/?/,""));history.replaceState(null,"",location.pathname+location.search+"#/");
 if(p.get("error_description")){toast(p.get("error_description").replace(/\+/g," "));return}
 try{const u=await authReq("/auth/v1/user","GET",null,p.get("access_token"));
