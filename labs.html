<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Labs | Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--ink:#12302f;--card:#fff;--line:#c9d8d4;--ok:#15803d;--bad:#b91c1c;--head:#12302f;--headtxt:#f4f7f6;--acc:#0f766e;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1c1c;--ink:#e6efed;--card:#142a2a;--line:#2b4545;--ok:#4ade80;--bad:#f87171;--head:#071212;--acc:#2dd4bf;--onacc:#04201d}}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{background:var(--head);color:var(--headtxt);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{font-weight:800;font-size:1.05rem;color:inherit;text-decoration:none;margin-right:auto}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:inherit;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:6px;opacity:.8}
.top nav a:hover{opacity:1}
.top nav a[aria-current=page]{background:rgba(255,255,255,.16);opacity:1}
main{padding-top:28px;padding-bottom:56px}
h1{font-size:clamp(1.8rem,5vw,2.7rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px}
.lead{max-width:56ch;opacity:.85;margin:0 0 26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hub{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:8px;padding:22px}
.hub:hover{border-color:var(--c)}
.hub .ic{font-size:2.2rem}
.hub h2{margin:6px 0}
.hub p{margin:0;opacity:.85;font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 14px;font-size:.88rem;font-weight:600}
h3{margin:34px 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.panel h2{margin:0 0 4px}
.panel>p{margin:0 0 12px;opacity:.85}
.btn{font:inherit;font-weight:600;border:2px solid var(--acc);background:var(--acc);color:var(--onacc);padding:8px 18px;border-radius:6px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:100px}
label{display:block;font-weight:600;margin:12px 0 4px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{font-size:2.6rem;font-weight:800;color:var(--acc);line-height:1.2}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.cols{display:flex;gap:14px;flex-wrap:wrap}
.cols>div{flex:1 1 140px}
.cols input,.cols select{width:100%}
.bits{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.bit{font:inherit;width:56px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.bit small{font-size:.75rem;opacity:.75}
.bit b{font-size:1.5rem}
.bit.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.out{margin-top:16px;padding:14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.out ul{margin:6px 0 0;padding-left:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin-top:14px}
.card{aspect-ratio:1;font:inherit;font-weight:600;font-size:.82rem;border-radius:8px;border:2px solid var(--line);background:var(--acc);color:var(--onacc);cursor:pointer;display:grid;place-items:center;padding:2px}
.card.up,.card.done{background:var(--bg);color:var(--ink)}
.card.done{border-color:var(--ok)}
.card.emo{font-size:1.9rem}
.scr{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;letter-spacing:.3em;margin:10px 0;word-break:break-all}
.msg{min-height:1.6em;font-weight:600;margin-top:10px}
.msg.g{color:var(--ok)}.msg.r{color:var(--bad)}
footer{text-align:center;font-size:.8rem;opacity:.7;padding:0 20px 28px}
</style>
<style>
.hm{display:grid;grid-template-columns:minmax(0,3fr) minmax(250px,2fr);gap:18px;margin-top:12px}
@media(max-width:820px){.hm{grid-template-columns:1fr}}
.hm canvas{width:100%;aspect-ratio:4/3;display:block;border-radius:8px;border:1px solid var(--line);background:#e8eff6;touch-action:none;cursor:grab}
.hm canvas:active{cursor:grabbing}
.hm-top{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.hm-tab{font:inherit;font-weight:600;padding:8px 16px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.hm-tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.hm-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hm-ctl .btn{padding:6px 12px;font-size:.88rem}
.hm-hint{font-size:.82rem;opacity:.75;margin:8px 0 0}
.hm-side h3{margin:0 0 8px}
.hm-side ul{margin:0 0 10px;padding-left:20px}
.hm-side li{margin:6px 0}
.hm-steps,.hm-lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hm-steps button,.hm-lv button{font:inherit;font-weight:600;min-width:38px;padding:6px 10px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.hm-steps button.on,.hm-lv button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.hm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hm-chips span,.hm-chip{font-size:.82rem;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
.hm-chip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hm-tip{font-size:.9rem;background:var(--bg);border-left:4px solid var(--acc);padding:8px 10px;border-radius:4px;margin:0 0 12px}
.hm-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}
.hm-bar i{display:block;height:100%;background:var(--acc)}
.hm-goal{margin:0 0 6px}
.hm-legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.hm-side label{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0}
.hm-mast{font-size:.88rem;opacity:.85;margin-top:12px}
</style>
</head>

<main class="wrap">
<h1>Interactive Labs</h1>
<p class="lead">Experiment with real numbers and see the result right away.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="panel" id="panel"></section>
</main>
<script>
const $=id=>document.getElementById(id);

function binary(el){
  let bits=[0,0,0,0,0,0,0,0];
  el.innerHTML=`<h2>Binary Lab (ICT)</h2><p>Computers count with 0s and 1s. Tap a bit to flip it.</p><div class="bits" id="bits"></div><div class="big" id="dec"></div><div id="eq"></div><label for="n">Or type a number from 0 to 255</label><input id="n" type="number" min="0" max="255">`;
  const draw=()=>{
    $("bits").innerHTML="";
    bits.forEach((b,i)=>{
      const v=128>>i,btn=document.createElement("button");
      btn.className="bit"+(b?" on":"");btn.innerHTML=`<small>${v}</small><b>${b}</b>`;
      btn.setAttribute("aria-label","Bit worth "+v+", currently "+b);
      btn.onclick=()=>{bits[i]=1-bits[i];draw()};$("bits").append(btn);
    });
    const parts=bits.map((b,i)=>b?128>>i:0).filter(Boolean),sum=parts.reduce((a,b)=>a+b,0);
    $("dec").textContent=sum;
    $("eq").textContent=parts.length?parts.join(" + ")+" = "+sum:"All bits are off, so the value is 0.";
  };
  $("n").oninput=e=>{const v=Math.max(0,Math.min(255,parseInt(e.target.value)||0));bits=v.toString(2).padStart(8,"0").split("").map(Number);draw()};
  draw();
}

function recipe(el){
  el.innerHTML=`<h2>Recipe Scaler (Home Economics)</h2><p>Change the number of servings and every ingredient adjusts.</p>
  <div class="cols"><div><label for="o">Recipe makes</label><input id="o" type="number" min="1" value="4"></div><div><label for="d">You need</label><input id="d" type="number" min="1" value="10"></div></div>
  <label for="ing">Ingredients (one per line, start with the amount)</label><textarea id="ing">2 cups rice\n1/2 tsp salt\n1 1/2 tbsp cooking oil\n3 cloves garlic</textarea>
  <div class="out"><b>Scaled ingredients</b><ul id="res"></ul></div>`;
  const fmt=n=>String(Math.round(n*100)/100);
  const num=s=>{s=s.trim();let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
  const run=()=>{
    const f=(+$("d").value||0)/(+$("o").value||1);
    $("res").innerHTML=$("ing").value.split("\n").filter(l=>l.trim()).map(l=>{
      const m=l.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
      return "<li>"+(m?fmt(num(m[1])*f)+" "+m[2]:l)+"</li>";
    }).join("");
  };
  ["o","d","ing"].forEach(i=>$(i).oninput=run);run();
}

function measure(el){
  const U={mm:1,cm:10,m:1000,in:25.4,ft:304.8};
  const opts=k=>Object.keys(U).map(u=>`<option ${u===k?"selected":""}>${u}</option>`).join("");
  el.innerHTML=`<h2>Measurement Converter (Industrial Arts)</h2><p>Convert between metric and inch units before you cut.</p>
  <div class="cols"><div><label for="v">Value</label><input id="v" type="number" value="2.5" step="any"></div><div><label for="f">From</label><select id="f">${opts("m")}</select></div><div><label for="t">To</label><select id="t">${opts("cm")}</select></div></div>
  <div class="out"><div class="big" id="r"></div><div id="note"></div></div>`;
  const run=()=>{
    const mm=(+$("v").value||0)*U[$("f").value],r=mm/U[$("t").value];
    $("r").textContent=(Math.round(r*1000)/1000)+" "+$("t").value;
    $("note").textContent="That equals "+(Math.round(mm/25.4*100)/100)+" inches or "+(Math.round(mm/10*100)/100)+" cm.";
  };
  ["v","f","t"].forEach(i=>$(i).oninput=run);run();
}

function planting(el){
  el.innerHTML=`<h2>Planting Calculator (Agri-Fishery Arts)</h2><p>Estimate how many seedlings your garden plot needs.</p>
  <div class="cols"><div><label for="L">Plot length (m)</label><input id="L" type="number" value="10" min="1" step="any"></div><div><label for="W">Plot width (m)</label><input id="W" type="number" value="4" min="1" step="any"></div></div>
  <div class="cols"><div><label for="rs">Space between rows (cm)</label><input id="rs" type="number" value="50" min="5"></div><div><label for="ps">Space between plants (cm)</label><input id="ps" type="number" value="30" min="5"></div></div>
  <div class="out"><div class="big" id="tot"></div><div id="det"></div></div>`;
  const run=()=>{
    const rows=Math.floor(($("W").value*100)/($("rs").value||1)),per=Math.floor(($("L").value*100)/($("ps").value||1));
    $("tot").textContent=(rows*per)+" seedlings";
    $("det").textContent=rows+" rows with "+per+" plants per row on a "+($("L").value*$("W").value)+" square meter plot.";
  };
  ["L","W","rs","ps"].forEach(i=>$(i).oninput=run);run();
}

function massage(el){
const PI=Math.PI,D=PI/180;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY="hm-progress-v1";let P;try{P=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){P={}}
P.d=P.d||{};P.fl=P.fl||0;
const savep=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};

/* ---------- 3D shapes ---------- */
function box(cx,cy,cz,w,h,d,c,cb){const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2;return[
 {v:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c},{v:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],c:cb||c},
 {v:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],c},{v:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],c},
 {v:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],c},{v:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],c}]}
function prism(p0,p1,r0,r1,n,c,c2){const a=norm(sub(p1,p0)),h=Math.abs(a[1])<.9?[0,1,0]:[1,0,0],u=norm(cross(a,h)),v=cross(a,u);
 const ring=(p,r)=>Array.from({length:n},(_,i)=>{const t=i/n*2*PI;return add(p,add(mul(u,r*Math.cos(t)),mul(v,r*Math.sin(t))))});
 const A=ring(p0,r0),B=ring(p1,r1),f=[];for(let i=0;i<n;i++){const j=(i+1)%n;f.push({v:[A[i],A[j],B[j],B[i]],c})}
 f.push({v:A,c:c2||c},{v:B,c:c2||c});return f}

/* ---------- the hand (local coords: palm centre at origin, fingers point to -z) ---------- */
const SK="#d9a07a",PK="#f0c3a8",NL="#f8e1d8";
const HAND=(()=>{const f=[...box(0,0,0,2,.45,2.2,SK,PK),...box(-.95,0,.5,.55,.45,1.1,SK,PK),...box(0,-.02,1.55,1.7,.4,.9,SK,PK),...box(0,-.03,2.95,1.9,.42,1.9,SK,PK),...box(0,-.232,-.25,1.3,.012,.05,"#c58a6c"),...box(0,-.232,.3,1.1,.012,.05,"#c58a6c")];
 const fing=(p,d,L,r)=>{L.forEach((len,i)=>{const q=add(p,mul(d,len));f.push(...prism(p,q,r*(1-i*.08),r*(1-(i+1)*.1),6,SK));p=q});f.push(...box(p[0]-d[0]*.18,r*.72,p[2]-d[2]*.18,r*1.2,.03,.28,NL))};
 [[-.72,-3,[.75,.55,.45],.19],[-.24,0,[.85,.6,.5],.2],[.24,3,[.78,.55,.45],.19],[.72,8,[.6,.42,.38],.17]].forEach(([x,a,L,r])=>fing([x,0,-1.1],[Math.sin(a*D),0,-Math.cos(a*D)],L,r));
 fing([-1,-.03,.55],[-Math.sin(40*D),0,-Math.cos(40*D)],[.8,.6],.24);return f})();

/* ---------- tools: id, name, colour-coded palette, original palette, size ---------- */
const TOOLS=[
 {id:"san",name:"Hand sanitizer",cn:"teal",col:["#14b8a6","#0f766e"],org:["#cfe8f5","#3b82f6"],h:1.6,w:.8,build:(a,b)=>[...prism([0,0,0],[0,1.3,0],.4,.4,8,a),...prism([0,1.3,0],[0,1.5,0],.17,.17,8,b),...box(.1,1.6,0,.55,.14,.2,b)]},
 {id:"tow",name:"Hand towel",cn:"blue",col:["#2563eb","#1e40af"],org:["#ffffff","#cbd5e1"],h:.25,w:2,build:(a,b)=>[...box(0,.1,0,2,.2,1.5,a),...box(0,.205,0,.45,.012,1.5,b)]},
 {id:"pad",name:"Wrist pad",cn:"purple",col:["#9333ea","#6b21a8"],org:["#b6bcc6","#8b93a1"],h:.12,w:1.7,build:(a,b)=>[...box(0,.05,0,1.7,.1,1,a),...box(0,.105,0,1.7,.01,.15,b)]},
 {id:"lot",name:"Massage lotion",cn:"green",col:["#16a34a","#14532d"],org:["#f8f3ea","#e8a0b4"],h:1.5,w:.66,build:(a,b)=>[...prism([0,0,0],[0,1.2,0],.33,.33,8,a),...prism([0,1.2,0],[0,1.5,0],.2,.2,8,b)]},
 {id:"oil",name:"Cuticle oil",cn:"yellow",col:["#eab308","#a16207"],org:["#b5651d","#1f2937"],h:1.3,w:.3,build:(a,b)=>[...prism([0,0,0],[0,1,0],.14,.14,8,a),...prism([0,1,0],[0,1.3,0],.1,.1,8,b)]},
 {id:"wt",name:"Warm towel",cn:"orange",col:["#f97316","#c2410c"],org:["#f3efe8","#e2d9c8"],h:.55,w:1.7,build:(a,b)=>[...box(0,.28,0,1.7,.56,1.1,a),...box(0,.575,0,.4,.012,1.1,b)]}
];
const PLACED={san:{x:-4.4,z:3.4,y:0},tow:{x:0,z:.8,y:0,sx:1.3,sy:.5,sz:2.8},pad:{x:0,z:3.2,y:.1},lot:{x:0,z:-.8,y:.58},oil:{x:0,z:-2.7,y:.56},wt:{x:0,z:.9,y:.6,sx:1.4,sy:.5,sz:3}};
const SLOTS=[[4.3,-3.2],[6.2,-3.2],[4.3,0],[6.2,0],[4.3,3.2],[6.2,3.2]];
const TASKS=[
 {t:"san",zx:-4.4,zz:3.4,zr:1.2,zy:.02,label:"Your hands",goal:"Clean your hands before you touch the client."},
 {t:"tow",zx:0,zz:.8,zr:2,zy:.02,label:"Under the hand and forearm",goal:"Protect the table and give the hand a soft, clean surface."},
 {t:"pad",zx:0,zz:3.2,zr:1,zy:.02,label:"Under the wrist",goal:"Support the wrist so the muscles can relax."},
 {t:"lot",zx:0,zz:-.8,zr:1,zy:.6,label:"Back of the hand",goal:"Add a little lotion so your hands glide smoothly."},
 {t:"oil",zx:0,zz:-2.7,zr:.8,zy:.58,label:"Fingertips and nails",goal:"Care for the cuticles and nails at the end."},
 {t:"wt",zx:0,zz:.9,zr:1.2,zy:.62,label:"Over the hand and wrist",goal:"Relax the hand and finish. Test the heat on your own wrist first."}
];
const tdef=id=>TOOLS.find(t=>t.id===id);

/* ---------- lessons ---------- */
const circ=(x,z,r)=>Array.from({length:25},(_,i)=>[x+r*Math.cos(i/24*2*PI),z+r*Math.sin(i/24*2*PI)]);
const LES=[
 {t:"Prepare and stay safe",side:0,cam:[0,.95,17.5],col:"#2563eb",strokes:[],pts:["Sanitize or wash your hands. Remove rings and bracelets that could scratch.","Ask about cuts, rashes, swelling, recent injuries, or allergies to lotion. Skip any affected area and never massage over broken skin.","Seat the client comfortably. Place a towel and a wrist pad under the hand and forearm.","Agree on pressure: ask the client to tell you if it feels too light or too firm."],chips:[["Tools","Sanitizer, towel, wrist pad"],["Pressure","Not yet"]],tip:"Never force a stroke. Stop if the client feels pain."},
 {t:"Apply the lotion",side:0,cam:[0,1.05,11],col:"#16a34a",strokes:[[[-.8,-1],[.8,-.6],[-.8,-.2],[.8,.2],[-.8,.6],[.8,1]]],pts:["Put a small amount of lotion in your palm and rub your hands together to warm it.","Spread it over the back of the hand, the fingers, and the wrist with your whole palm.","Add more only if your hands drag. Too much lotion makes strokes slippery and hard to control."],chips:[["Pressure","Very light"],["Stroke","Spreading"]],tip:"Check that the client has no allergy to the product."},
 {t:"Long gliding strokes",side:0,cam:[.25,1.05,11],col:"#2563eb",strokes:[[[-.5,-2.9],[-.5,1.8]],[[0,-3],[0,1.8]],[[.5,-2.6],[.5,1.8]]],pts:["Cradle the hand with one hand. With the other, glide from the fingertips toward the wrist in one smooth line.","Return with almost no pressure, then repeat 5 to 6 times.","Keep a steady rhythm. These strokes warm the skin and help the client relax."],chips:[["Pressure","Light to medium"],["Direction","Toward the wrist and heart"]],tip:"Keep your own wrists relaxed so the glide stays smooth."},
 {t:"Thumb strokes between the tendons",side:0,cam:[-.2,1.15,9],col:"#9333ea",strokes:[-.6,-.2,.2,.6].map(x=>[[x,-1],[x,1.1]]),pts:["Rest your fingers under the palm for support.","Use the pad of your thumb in the grooves between the tendons, moving from the knuckles toward the wrist.","Work each groove with small, slow, overlapping strokes."],chips:[["Pressure","Medium"],["Direction","Knuckles to wrist"]],tip:"Avoid pressing hard on bones or knuckles."},
 {t:"Palm kneading",side:1,cam:[.3,1.15,9],col:"#ea580c",strokes:[circ(0,-.1,.55),circ(-.85,.5,.35),circ(.7,.2,.35)],pts:["Turn the hand palm up and support the back of it.","Make small thumb circles across the center of the palm.","Press and release the fleshy base of the thumb and the pad on the little-finger side."],chips:[["Pressure","Medium, then release slowly"],["Stroke","Small circles"]],tip:"Ease off right away if the client says it hurts."},
 {t:"Fingers and thumb",side:0,cam:[-.15,1.1,9],col:"#0e7490",strokes:[[[-.72,-1.1],[-.88,-3]],[[-.24,-1.1],[-.24,-3.05]],[[.24,-1.1],[.35,-2.9]],[[.72,-1.1],[.97,-2.5]],[[-1,.55],[-1.9,-.52]]],pts:["Hold one finger at its base between your thumb and index finger.","Squeeze lightly and slide to the tip, then give a gentle, slow pull. Never jerk.","Make small circles around each joint. Do all four fingers and the thumb."],chips:[["Pressure","Light to medium"],["Direction","Base to tip"]],tip:"Skip any swollen or painful joint."},
 {t:"Wrist and finish",side:0,cam:[.2,1,12],col:"#be185d",strokes:[circ(0,1.55,.55),[[0,-2.8],[0,3.6]]],pts:["Hold the forearm still and gently circle the wrist a few times each way, only as far as is comfortable.","Finish with two or three slow glides from the fingertips up the forearm.","Wrap the hand in a warm towel. Test the heat on your own wrist first. Add cuticle oil if you wish.","Ask for feedback, then wash your hands and clean the station."],chips:[["Pressure","Light"],["Towel","Warm, not hot"]],tip:"A warm towel should feel pleasantly warm, never hot."}
];

/* ---------- state ---------- */
const S={mode:"learn",step:0,level:1,orig:false,sel:null};
let tools=[],run=null,drag=null,down=null,camDrag=null,raf=0,last=0;
let cam={yaw:0,pitch:.95,dist:17.5},camT={yaw:0,pitch:.95,dist:17.5},tg=[0,.3,.4],tgT=[0,.3,.4],hang=0,hT=0,path=null;
let camS=null;

el.innerHTML=`<h2>Hand Massage 3D (Home Economics)</h2><p>Learn each step, then practice by dragging the tools into place until you master it.</p>
<div class="hm-top"><button class="hm-tab" data-m="learn">1. Learn the steps</button><button class="hm-tab" data-m="practice">2. Practice with tools</button></div>
<div class="hm"><div><canvas id="hmc" role="img" aria-label="3D hand massage scene"></canvas>
<div class="hm-ctl"><button class="btn alt" id="hflip">Flip hand</button><button class="btn alt" id="hzin">Zoom +</button><button class="btn alt" id="hzout">Zoom −</button><button class="btn alt" id="hreset">Reset view</button></div>
<p class="hm-hint">Drag empty space to rotate the view. On a phone you can also tap a tool, then tap where it goes.</p></div>
<div class="hm-side" id="hside"></div></div>`;
const cv=el.querySelector("#hmc"),ctx=cv.getContext("2d"),side=el.querySelector("#hside");

/* ---------- tools ---------- */
const pal=d=>(S.level===3&&S.mode==="practice")||S.orig?d.org:d.col;
function makeTools(shuf){
 const order=SLOTS.map((_,i)=>i);if(shuf)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 return TOOLS.map((d,i)=>{const s=SLOTS[order[i]];return{d,id:d.id,x:s[0],z:s[1],y:0,lift:0,sx:1,sy:1,sz:1,tx:s[0],tz:s[1],ty:0,tsx:1,tsy:1,tsz:1,hx:s[0],hz:s[1],placed:false,faces:d.build(...pal(d))}});
}
const goHome=t=>{Object.assign(t,{tx:t.hx,tz:t.hz,ty:0,tsx:1,tsy:1,tsz:1})};
function place(t){const p=PLACED[t.id];Object.assign(t,{placed:true,tx:p.x,tz:p.z,ty:p.y,tsx:p.sx||1,tsy:p.sy||1,tsz:p.sz||1})}

/* ---------- modes ---------- */
function setMode(m){
 S.mode=m;S.sel=null;
 el.querySelectorAll(".hm-tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===m));
 if(m==="learn"){tools=makeTools(false);run=null;goStep(S.step)}else startRun();
}
function goStep(i){
 S.step=clamp(i,0,LES.length-1);const L=LES[S.step];
 hT=L.side?PI:0;camT={yaw:L.cam[0],pitch:L.cam[1],dist:L.cam[2]};tgT=[S.step===0?1.1:.3,.3,.4];
 let tot=0;const lens=L.strokes.map(s=>{let l=0;for(let k=1;k<s.length;k++)l+=Math.hypot(s[k][0]-s[k-1][0],s[k][1]-s[k-1][1]);tot+=l;return l});
 path={strokes:L.strokes,lens,tot,col:L.col,y:L.side?-.3:.3};renderSide();
}
function startRun(){
 run={idx:0,mistakes:0,msg:"Pick up a tool and drag it to the right place.",cls:"",done:false};
 tools=makeTools(true);path=null;S.sel=null;hT=0;camT={yaw:0,pitch:.95,dist:17.5};tgT=[1.2,.3,.4];renderSide();
}
function finish(){
 const k=run;k.done=true;P.d[S.level]=true;if(S.level===3&&k.mistakes===0)P.fl++;savep();
}

/* ---------- side panel ---------- */
function renderSide(){
 if(S.mode==="learn"){
  const L=LES[S.step];
  side.innerHTML=`<div class="hm-steps">${LES.map((l,i)=>`<button data-a="step" data-i="${i}" class="${i===S.step?"on":""}" aria-label="Step ${i+1}: ${l.t}">${i+1}</button>`).join("")}</div><h3>Step ${S.step+1}: ${L.t}</h3><ul>${L.pts.map(p=>`<li>${p}</li>`).join("")}</ul><div class="hm-chips">${L.chips.map(c=>`<span><b>${c[0]}:</b> ${c[1]}</span>`).join("")}</div><p class="hm-tip"><b>Safety tip:</b> ${L.tip}</p><div class="row"><button class="btn alt" data-a="prev"${S.step?"":" disabled"}>Back</button><button class="btn" data-a="next">${S.step===LES.length-1?"Start practice":"Next step"}</button></div><p class="hm-hint">The moving dot shows the stroke direction. Drag the scene to look from any angle.</p>`;
  return;
 }
 const k=run,lv=S.level,task=TASKS[Math.min(k.idx,TASKS.length-1)],td=tdef(task.t);
 const goal=lv===1?`Drag the <b>${td.name}</b> (${td.cn}) to <b>“${task.label}”</b>. ${task.goal}`:lv===2?`${task.goal} Choose the right tool and match its color to the target.`:task.goal;
 let body;
 if(k.done){
  const acc=Math.round(TASKS.length/(TASKS.length+k.mistakes)*100);
  body=`<h3>Level ${lv} complete!</h3><p>Accuracy: <b>${acc}%</b> · Mistakes: <b>${k.mistakes}</b></p>`+(lv===3?(k.mistakes===0?`<p>Flawless run! You need 2 flawless Level 3 runs to master this (${Math.min(P.fl,2)} of 2).</p>`:`<p>To master it you need a Level 3 run with no mistakes. Try again.</p>`):`<p>${k.mistakes===0?"Perfect.":"Good work."} Move up when you are ready.</p>`)+`<div class="row"><button class="btn alt" data-a="restart">Try again</button>${lv<3?`<button class="btn" data-a="nextlvl">Next level</button>`:""}<button class="btn alt" data-a="learn">Review steps</button></div>`;
 }else{
  body=`<p class="hm-goal"><b>Step ${k.idx+1} of ${TASKS.length}.</b> ${goal}</p><div class="hm-bar"><i style="width:${k.idx/TASKS.length*100}%"></i></div><p>Mistakes: <b>${k.mistakes}</b></p>`+(lv<3?`<div class="hm-legend">${TOOLS.map(d=>`<span class="hm-chip"><i style="background:${(S.orig?d.org:d.col)[0]};border:1px solid #0003"></i>${d.name}</span>`).join("")}</div>`:`<p class="hm-hint">Level 3 uses original colors. Identify each tool by its shape.</p>`)+`<p class="msg ${k.cls}" aria-live="polite">${k.msg}</p><div class="row"><button class="btn alt" data-a="restart">Restart</button></div>`;
 }
 side.innerHTML=`<div class="hm-lv">${[1,2,3].map(n=>`<button data-a="lvl" data-i="${n}" class="${n===lv?"on":""}">Level ${n}${P.d[n]?" ✓":""}</button>`).join("")}</div><p class="hm-hint" style="margin:0 0 10px">${["","Guided: the target glows.","Matching colors: match each tool's color to its target.","Original colors: no guides. Learn by memory."][lv]}</p>${body}<label${lv===3?' hidden':''}><input type="checkbox" id="orig" ${S.orig?"checked":""}> Show original tool colors</label><p class="hm-mast">${P.fl>=2?"🏅 <b>Mastered!</b> ":""}Level 3 flawless runs: ${Math.min(P.fl,2)} / 2</p>`;
}
side.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==="step")goStep(i);else if(a==="prev")goStep(S.step-1);else if(a==="next"){S.step===LES.length-1?setMode("practice"):goStep(S.step+1)}
 else if(a==="lvl"){S.level=i;startRun()}else if(a==="restart")startRun();else if(a==="nextlvl"){S.level=Math.min(3,S.level+1);startRun()}else if(a==="learn")setMode("learn")};
side.onchange=e=>{if(e.target.id==="orig"){S.orig=e.target.checked;tools.forEach(t=>t.faces=t.d.build(...pal(t.d)));renderSide()}};
el.querySelectorAll(".hm-tab").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
el.querySelector("#hflip").onclick=()=>{hT=hT?0:PI};
el.querySelector("#hzin").onclick=()=>{camT.dist=clamp(camT.dist*.85,6,22)};
el.querySelector("#hzout").onclick=()=>{camT.dist=clamp(camT.dist*1.18,6,22)};
el.querySelector("#hreset").onclick=()=>{if(S.mode==="learn")goStep(S.step);else{camT={yaw:0,pitch:.95,dist:17.5};tgT=[1.2,.3,.4]}};

/* ---------- camera + input ---------- */
const proj=p=>{const C=camS,d=sub(p,C.eye),z=dot(d,C.fw);return[C.W/2+C.F*dot(d,C.rt)/z,C.H/2-C.F*dot(d,C.up)/z,z]};
const ray=(sx,sy,h)=>{const C=camS,d=add(add(C.fw,mul(C.rt,(sx-C.W/2)/C.F)),mul(C.up,-(sy-C.H/2)/C.F));if(d[1]>-.03)return null;return add(C.eye,mul(d,(h-C.eye[1])/d[1]))};
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
function pick(sx,sy){let best=null,bd=1e9;for(const t of tools){if(t.placed)continue;const c=proj([t.x,t.y+t.d.h*t.sy/2,t.z]);const rad=Math.max(camS.H*.08,t.d.w*.5*camS.F/c[2]);const dd=Math.hypot(c[0]-sx,c[1]-sy);if(dd<rad&&dd<bd){bd=dd;best=t}}return best}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);const[sx,sy]=pt(e);down={sx,sy,x:e.clientX,y:e.clientY,moved:0};
 if(S.mode==="practice"&&run&&!run.done&&!S.sel){const t=pick(sx,sy);if(t){drag=t;t.drag=true;return}}
 camDrag={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointermove",e=>{if(!down)return;const[sx,sy]=pt(e);down.moved=Math.max(down.moved,Math.hypot(sx-down.sx,sy-down.sy));
 if(drag){const p=ray(sx,sy,.9);if(p){drag.x=clamp(p[0],-7.4,7.4);drag.z=clamp(p[2],-5,5)}}
 else if(camDrag){cam.yaw=camT.yaw=cam.yaw-(e.clientX-camDrag.x)*.008;cam.pitch=camT.pitch=clamp(cam.pitch+(e.clientY-camDrag.y)*.006,.3,1.45);camDrag={x:e.clientX,y:e.clientY}}});
const up=e=>{if(!down)return;const[sx,sy]=pt(e),tap=down.moved<camS.H*.02;
 if(drag){const t=drag;drag=null;t.drag=false;if(tap){S.sel=t;goHome(t)}else drop(t)}
 else if(tap&&S.sel&&run&&!run.done){const p=ray(sx,sy,.9),t=S.sel;S.sel=null;if(p){t.x=p[0];t.z=p[2];drop(t)}}
 down=null;camDrag=null};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();camT.dist=cam.dist=clamp(cam.dist*(1+e.deltaY*.001),6,22)},{passive:false});

/* ---------- practice logic ---------- */
function drop(t){
 const k=run;if(!k||k.done)return;
 if(t.x>3){goHome(t);return}
 const task=TASKS[k.idx],need=tdef(task.t),inZone=Math.hypot(t.x-task.zx,t.z-task.zz)<=task.zr,easy=S.level<3;
 if(t.id===task.t&&inZone){place(t);k.idx++;k.cls="g";k.msg="Correct! "+task.goal;if(k.idx>=TASKS.length){finish();k.msg="All steps done!"}}
 else{k.mistakes++;k.cls="r";goHome(t);
  k.msg=t.id!==task.t?(easy?`That is the ${t.d.name}. This step needs the ${need.name}.`:"Not quite. Think about what this step needs."):(easy?`Right tool, wrong spot. Move it to “${task.label}”.`:"Right tool, but check where it belongs.")}
 renderSide();
}

/* ---------- drawing ---------- */
const LD=norm([-.35,.9,.5]),hexc={};
const rgb=c=>hexc[c]||(hexc[c]=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)));
const shade=(c,n)=>{const r=rgb(c),k=.5+.5*Math.abs(dot(n,LD));return`rgb(${r[0]*k|0},${r[1]*k|0},${r[2]*k|0})`};
const poly=(pts,fill,stroke,lw)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}};
const flat=(pts,y)=>pts.map(q=>proj([q[0],y,q[1]]));
function label(txt,p,col){const H=camS.H;ctx.font=`600 ${Math.round(H*.03)}px Lexend,system-ui,sans-serif`;const w=ctx.measureText(txt).width+16,h=H*.05;ctx.fillStyle="rgba(255,255,255,.92)";ctx.fillRect(p[0]-w/2,p[1]-h/2,w,h);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(p[0]-w/2,p[1]-h/2,w,h);ctx.fillStyle="#12302f";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,p[0],p[1]+1)}

function frame(now){
 raf=requestAnimationFrame(frame);
 const dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);
 if(!W||!H)return;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 const t=now/1000;
 for(const k of["yaw","pitch","dist"])cam[k]+=(camT[k]-cam[k])*.1;tg=tg.map((v,i)=>v+(tgT[i]-v)*.1);hang+=(hT-hang)*.12;
 const cp=Math.cos(cam.pitch),eye=[tg[0]+cam.dist*cp*Math.sin(cam.yaw),tg[1]+cam.dist*Math.sin(cam.pitch),tg[2]+cam.dist*cp*Math.cos(cam.yaw)];
 const fw=norm(sub(tg,eye)),rt=norm(cross(fw,[0,1,0]));camS={eye,fw,rt,up:cross(rt,fw),W,H,F:H*1.3};
 for(const o of tools){if(!o.drag){o.x+=(o.tx-o.x)*.2;o.z+=(o.tz-o.z)*.2}o.y+=(o.ty-o.y)*.2;o.sx+=(o.tsx-o.sx)*.2;o.sy+=(o.tsy-o.sy)*.2;o.sz+=(o.tsz-o.sz)*.2;o.lift+=(((o.drag||S.sel===o)?.7:0)-o.lift)*.25}
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#d6e5f4");g.addColorStop(1,"#f3f6fa");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const T=flat([[-7.6,-5.2],[7.6,-5.2],[7.6,5.2],[-7.6,5.2]],0);poly(T,"#e7d6bd","#b99d77",2);
 poly(flat([[3,-4.6],[7.4,-4.6],[7.4,4.6],[3,4.6]],.004),"#cdd8e4","#8ea1b8",2);
 const polys=[];
 const addF=(faces,tf,bias)=>{for(const fc of faces){const v3=fc.v.map(tf),p=v3.map(proj);if(p.some(q=>q[2]<.3))continue;let z=0;for(const q of p)z+=q[2];polys.push({p,z:z/p.length-(bias||0),c:fc.c,n:norm(cross(sub(v3[1],v3[0]),sub(v3[2],v3[0])))})}};
 const ca=Math.cos(hang),sa=Math.sin(hang);addF(HAND,p=>[p[0]*ca-p[1]*sa,p[0]*sa+p[1]*ca+.35,p[2]]);
 for(const o of tools)addF(o.faces,p=>[p[0]*o.sx+o.x,p[1]*o.sy+o.y+o.lift,p[2]*o.sz+o.z]);
 if(S.mode==="practice"&&run&&!run.done&&S.level<3){
  const lst=S.level===1?[run.idx]:TASKS.map((_,i)=>i).filter(i=>i>=run.idx);
  for(const i of lst){const z=TASKS[i],col=tdef(z.t).col[0],pts=Array.from({length:28},(_,j)=>[z.zx+z.zr*Math.cos(j/28*2*PI),z.zz+z.zr*Math.sin(j/28*2*PI)]),p=flat(pts,z.zy),c=rgb(col);
   polys.push({zone:1,p,z:proj([z.zx,z.zy,z.zz])[2]-.2,col,a:S.level===1?.3+.15*Math.sin(t*4):.2,c})}
 }
 polys.sort((a,b)=>b.z-a.z);
 for(const q of polys){
  if(q.zone){poly(q.p,`rgba(${q.c[0]},${q.c[1]},${q.c[2]},${q.a})`,q.col,Math.max(2,H*.006));continue}
  poly(q.p,shade(q.c,q.n),"rgba(0,0,0,.28)",1)}
 if(path&&path.tot){
  const hp=(x,z)=>{const p=[x,path.y,z];return proj([p[0]*ca-p[1]*sa,p[0]*sa+p[1]*ca+.35,p[2]])};
  ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=path.col+"aa";ctx.lineWidth=H*.013;
  for(const s of path.strokes){ctx.beginPath();s.forEach((q,i)=>{const p=hp(q[0],q[1]);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.stroke()}
  let s=(t*1.8)%path.tot,i=0;while(i<path.strokes.length-1&&s>path.lens[i]){s-=path.lens[i];i++}
  const st=path.strokes[i],L=path.lens[i]||1;let acc=0,pos=st[0];
  for(let k=1;k<st.length;k++){const sl=Math.hypot(st[k][0]-st[k-1][0],st[k][1]-st[k-1][1]);if(acc+sl>=s){const f=(s-acc)/(sl||1);pos=[st[k-1][0]+(st[k][0]-st[k-1][0])*f,st[k-1][1]+(st[k][1]-st[k-1][1])*f];break}acc+=sl;pos=st[k]}
  const dp=hp(pos[0],pos[1]);ctx.beginPath();ctx.arc(dp[0],dp[1],H*.022,0,2*PI);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=H*.008;ctx.strokeStyle=path.col;ctx.stroke();
 }
 if(S.mode==="learn"||(run&&S.level===1)){
  for(const o of tools)if(!o.placed&&!o.drag)label(o.d.name,proj([o.x,o.y+o.d.h*o.sy+.55,o.z]),o.d.col[0]);
  if(S.mode==="practice"&&!run.done){const z=TASKS[run.idx];label(z.label,proj([z.zx,z.zy+.1,z.zz]),tdef(z.t).col[0])}
 }
}
setMode("learn");
raf=requestAnimationFrame(frame);
window._mstop=()=>cancelAnimationFrame(raf);
window.__hm={proj:p=>proj(p),get tools(){return tools},get run(){return run},S,TASKS};
}

const LABS=[{n:"💻 Binary",f:binary},{n:"🍳 Recipe Scaler",f:recipe},{n:"🙌 Hand Massage 3D",f:massage},{n:"📏 Measurement",f:measure},{n:"🌱 Planting",f:planting}];
LABS.forEach((l,i)=>{
  const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.textContent=l.n;
  b.onclick=()=>{if(window._mstop){window._mstop();window._mstop=null}document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===b));l.f($("panel"))};
  $("tabs").append(b);
  if(!i)b.click();
});
</script>
</body>
</html>
