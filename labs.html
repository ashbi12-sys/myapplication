<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Labs | Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--ink:#12302f;--card:#fff;--line:#c9d8d4;--ok:#15803d;--bad:#b91c1c;--head:#12302f;--headtxt:#f4f7f6;--acc:#0f766e;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1c1c;--ink:#e6efed;--card:#142a2a;--line:#2b4545;--ok:#4ade80;--bad:#f87171;--head:#071212;--acc:#2dd4bf;--onacc:#04201d}}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{background:var(--head);color:var(--headtxt);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{font-weight:800;font-size:1.05rem;color:inherit;text-decoration:none;margin-right:auto}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:inherit;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:6px;opacity:.8}
.top nav a:hover{opacity:1}
.top nav a[aria-current=page]{background:rgba(255,255,255,.16);opacity:1}
main{padding-top:28px;padding-bottom:56px}
h1{font-size:clamp(1.8rem,5vw,2.7rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px}
.lead{max-width:56ch;opacity:.85;margin:0 0 26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hub{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:8px;padding:22px}
.hub:hover{border-color:var(--c)}
.hub .ic{font-size:2.2rem}
.hub h2{margin:6px 0}
.hub p{margin:0;opacity:.85;font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 14px;font-size:.88rem;font-weight:600}
h3{margin:34px 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.panel h2{margin:0 0 4px}
.panel>p{margin:0 0 12px;opacity:.85}
.btn{font:inherit;font-weight:600;border:2px solid var(--acc);background:var(--acc);color:var(--onacc);padding:8px 18px;border-radius:6px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:100px}
label{display:block;font-weight:600;margin:12px 0 4px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{font-size:2.6rem;font-weight:800;color:var(--acc);line-height:1.2}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.cols{display:flex;gap:14px;flex-wrap:wrap}
.cols>div{flex:1 1 140px}
.cols input,.cols select{width:100%}
.bits{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.bit{font:inherit;width:56px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.bit small{font-size:.75rem;opacity:.75}
.bit b{font-size:1.5rem}
.bit.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.out{margin-top:16px;padding:14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.out ul{margin:6px 0 0;padding-left:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin-top:14px}
.card{aspect-ratio:1;font:inherit;font-weight:600;font-size:.82rem;border-radius:8px;border:2px solid var(--line);background:var(--acc);color:var(--onacc);cursor:pointer;display:grid;place-items:center;padding:2px}
.card.up,.card.done{background:var(--bg);color:var(--ink)}
.card.done{border-color:var(--ok)}
.card.emo{font-size:1.9rem}
.scr{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;letter-spacing:.3em;margin:10px 0;word-break:break-all}
.msg{min-height:1.6em;font-weight:600;margin-top:10px}
.msg.g{color:var(--ok)}.msg.r{color:var(--bad)}
footer{text-align:center;font-size:.8rem;opacity:.7;padding:0 20px 28px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="index.html">Learning Hub</a>
<nav aria-label="Main"><a href="index.html">Home</a><a href="quiz.html">Quizzes</a><a href="labs.html" aria-current="page">Labs</a><a href="games.html">Games</a><a href="records.html">Records</a></nav>
</div></header>
<main class="wrap">
<h1>Interactive Labs</h1>
<p class="lead">Experiment with real numbers and see the result right away.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="panel" id="panel"></section>
</main>
<script>
const $=id=>document.getElementById(id);

function binary(el){
  let bits=[0,0,0,0,0,0,0,0];
  el.innerHTML=`<h2>Binary Lab (ICT)</h2><p>Computers count with 0s and 1s. Tap a bit to flip it.</p><div class="bits" id="bits"></div><div class="big" id="dec"></div><div id="eq"></div><label for="n">Or type a number from 0 to 255</label><input id="n" type="number" min="0" max="255">`;
  const draw=()=>{
    $("bits").innerHTML="";
    bits.forEach((b,i)=>{
      const v=128>>i,btn=document.createElement("button");
      btn.className="bit"+(b?" on":"");btn.innerHTML=`<small>${v}</small><b>${b}</b>`;
      btn.setAttribute("aria-label","Bit worth "+v+", currently "+b);
      btn.onclick=()=>{bits[i]=1-bits[i];draw()};$("bits").append(btn);
    });
    const parts=bits.map((b,i)=>b?128>>i:0).filter(Boolean),sum=parts.reduce((a,b)=>a+b,0);
    $("dec").textContent=sum;
    $("eq").textContent=parts.length?parts.join(" + ")+" = "+sum:"All bits are off, so the value is 0.";
  };
  $("n").oninput=e=>{const v=Math.max(0,Math.min(255,parseInt(e.target.value)||0));bits=v.toString(2).padStart(8,"0").split("").map(Number);draw()};
  draw();
}

function recipe(el){
  el.innerHTML=`<h2>Recipe Scaler (Home Economics)</h2><p>Change the number of servings and every ingredient adjusts.</p>
  <div class="cols"><div><label for="o">Recipe makes</label><input id="o" type="number" min="1" value="4"></div><div><label for="d">You need</label><input id="d" type="number" min="1" value="10"></div></div>
  <label for="ing">Ingredients (one per line, start with the amount)</label><textarea id="ing">2 cups rice\n1/2 tsp salt\n1 1/2 tbsp cooking oil\n3 cloves garlic</textarea>
  <div class="out"><b>Scaled ingredients</b><ul id="res"></ul></div>`;
  const fmt=n=>String(Math.round(n*100)/100);
  const num=s=>{s=s.trim();let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
  const run=()=>{
    const f=(+$("d").value||0)/(+$("o").value||1);
    $("res").innerHTML=$("ing").value.split("\n").filter(l=>l.trim()).map(l=>{
      const m=l.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
      return "<li>"+(m?fmt(num(m[1])*f)+" "+m[2]:l)+"</li>";
    }).join("");
  };
  ["o","d","ing"].forEach(i=>$(i).oninput=run);run();
}

function measure(el){
  const U={mm:1,cm:10,m:1000,in:25.4,ft:304.8};
  const opts=k=>Object.keys(U).map(u=>`<option ${u===k?"selected":""}>${u}</option>`).join("");
  el.innerHTML=`<h2>Measurement Converter (Industrial Arts)</h2><p>Convert between metric and inch units before you cut.</p>
  <div class="cols"><div><label for="v">Value</label><input id="v" type="number" value="2.5" step="any"></div><div><label for="f">From</label><select id="f">${opts("m")}</select></div><div><label for="t">To</label><select id="t">${opts("cm")}</select></div></div>
  <div class="out"><div class="big" id="r"></div><div id="note"></div></div>`;
  const run=()=>{
    const mm=(+$("v").value||0)*U[$("f").value],r=mm/U[$("t").value];
    $("r").textContent=(Math.round(r*1000)/1000)+" "+$("t").value;
    $("note").textContent="That equals "+(Math.round(mm/25.4*100)/100)+" inches or "+(Math.round(mm/10*100)/100)+" cm.";
  };
  ["v","f","t"].forEach(i=>$(i).oninput=run);run();
}

function planting(el){
  el.innerHTML=`<h2>Planting Calculator (Agri-Fishery Arts)</h2><p>Estimate how many seedlings your garden plot needs.</p>
  <div class="cols"><div><label for="L">Plot length (m)</label><input id="L" type="number" value="10" min="1" step="any"></div><div><label for="W">Plot width (m)</label><input id="W" type="number" value="4" min="1" step="any"></div></div>
  <div class="cols"><div><label for="rs">Space between rows (cm)</label><input id="rs" type="number" value="50" min="5"></div><div><label for="ps">Space between plants (cm)</label><input id="ps" type="number" value="30" min="5"></div></div>
  <div class="out"><div class="big" id="tot"></div><div id="det"></div></div>`;
  const run=()=>{
    const rows=Math.floor(($("W").value*100)/($("rs").value||1)),per=Math.floor(($("L").value*100)/($("ps").value||1));
    $("tot").textContent=(rows*per)+" seedlings";
    $("det").textContent=rows+" rows with "+per+" plants per row on a "+($("L").value*$("W").value)+" square meter plot.";
  };
  ["L","W","rs","ps"].forEach(i=>$(i).oninput=run);run();
}

const LABS=[{n:"💻 Binary",f:binary},{n:"🍳 Recipe Scaler",f:recipe},{n:"📏 Measurement",f:measure},{n:"🌱 Planting",f:planting}];
LABS.forEach((l,i)=>{
  const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.textContent=l.n;
  b.onclick=()=>{document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===b));l.f($("panel"))};
  $("tabs").append(b);
  if(!i)b.click();
});
</script>
</body>
</html>
