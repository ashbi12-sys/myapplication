<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Labs | Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--ink:#12302f;--card:#fff;--line:#c9d8d4;--ok:#15803d;--bad:#b91c1c;--head:#12302f;--headtxt:#f4f7f6;--acc:#0f766e;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1c1c;--ink:#e6efed;--card:#142a2a;--line:#2b4545;--ok:#4ade80;--bad:#f87171;--head:#071212;--acc:#2dd4bf;--onacc:#04201d}}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{background:var(--head);color:var(--headtxt);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{font-weight:800;font-size:1.05rem;color:inherit;text-decoration:none;margin-right:auto}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:inherit;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:6px;opacity:.8}
.top nav a:hover{opacity:1}
.top nav a[aria-current=page]{background:rgba(255,255,255,.16);opacity:1}
main{padding-top:28px;padding-bottom:56px}
h1{font-size:clamp(1.8rem,5vw,2.7rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px}
.lead{max-width:56ch;opacity:.85;margin:0 0 26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hub{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:8px;padding:22px}
.hub:hover{border-color:var(--c)}
.hub .ic{font-size:2.2rem}
.hub h2{margin:6px 0}
.hub p{margin:0;opacity:.85;font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 14px;font-size:.88rem;font-weight:600}
h3{margin:34px 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.panel h2{margin:0 0 4px}
.panel>p{margin:0 0 12px;opacity:.85}
.btn{font:inherit;font-weight:600;border:2px solid var(--acc);background:var(--acc);color:var(--onacc);padding:8px 18px;border-radius:6px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:100px}
label{display:block;font-weight:600;margin:12px 0 4px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{font-size:2.6rem;font-weight:800;color:var(--acc);line-height:1.2}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.cols{display:flex;gap:14px;flex-wrap:wrap}
.cols>div{flex:1 1 140px}
.cols input,.cols select{width:100%}
.bits{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.bit{font:inherit;width:56px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.bit small{font-size:.75rem;opacity:.75}
.bit b{font-size:1.5rem}
.bit.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.out{margin-top:16px;padding:14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.out ul{margin:6px 0 0;padding-left:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin-top:14px}
.card{aspect-ratio:1;font:inherit;font-weight:600;font-size:.82rem;border-radius:8px;border:2px solid var(--line);background:var(--acc);color:var(--onacc);cursor:pointer;display:grid;place-items:center;padding:2px}
.card.up,.card.done{background:var(--bg);color:var(--ink)}
.card.done{border-color:var(--ok)}
.card.emo{font-size:1.9rem}
.scr{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;letter-spacing:.3em;margin:10px 0;word-break:break-all}
.msg{min-height:1.6em;font-weight:600;margin-top:10px}
.msg.g{color:var(--ok)}.msg.r{color:var(--bad)}
footer{text-align:center;font-size:.8rem;opacity:.7;padding:0 20px 28px}
</style>
<style>
.hm{display:grid;grid-template-columns:minmax(0,5fr) minmax(250px,3fr);gap:18px;margin-top:12px}
@media(max-width:820px){.hm{grid-template-columns:1fr}}
.hm canvas{width:100%;aspect-ratio:4/3;display:block;border-radius:8px;border:1px solid var(--line);background:#e8eff6;touch-action:none;cursor:grab}
.hm canvas:active{cursor:grabbing}
.hm-top{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.hm-tab{font:inherit;font-weight:600;padding:8px 16px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.hm-tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.hm-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hm-ctl .btn{padding:6px 12px;font-size:.88rem}
.hm-hint{font-size:.82rem;opacity:.75;margin:8px 0 0}
.hm-side h3{margin:0 0 8px}
.hm-side ul{margin:0 0 10px;padding-left:20px}
.hm-side li{margin:6px 0}
.hm-steps,.hm-lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hm-steps button,.hm-lv button{font:inherit;font-weight:600;min-width:38px;padding:6px 10px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.hm-steps button.on,.hm-lv button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.hm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hm-chips span,.hm-chip{font-size:.82rem;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
.hm-chip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hm-tip{font-size:.9rem;background:var(--bg);border-left:4px solid var(--acc);padding:8px 10px;border-radius:4px;margin:0 0 12px}
.hm-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}
.hm-bar i{display:block;height:100%;background:var(--acc)}
.hm-goal{margin:0 0 6px}
.hm-legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.hm-side label{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0}
.hm-mast{font-size:.88rem;opacity:.85;margin-top:12px}
.hm-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hm-tools button{font:inherit;font-size:.82rem;font-weight:600;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:3px 10px;cursor:pointer}
.hm-tools button.on{background:#f59e0b;border-color:#f59e0b;color:#2b1a00}
.hm-lbl{font-size:.8rem;font-weight:600;opacity:.8;margin-bottom:6px}
.hm-skin{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:600;font-size:.88rem}
.hm-skin select{padding:4px 8px}
</style>
</head>

<main class="wrap">
<h1>Interactive Labs</h1>
<p class="lead">Experiment with real numbers and see the result right away.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="panel" id="panel"></section>
</main>
<script>
const $=id=>document.getElementById(id);

function binary(el){
  let bits=[0,0,0,0,0,0,0,0];
  el.innerHTML=`<h2>Binary Lab (ICT)</h2><p>Computers count with 0s and 1s. Tap a bit to flip it.</p><div class="bits" id="bits"></div><div class="big" id="dec"></div><div id="eq"></div><label for="n">Or type a number from 0 to 255</label><input id="n" type="number" min="0" max="255">`;
  const draw=()=>{
    $("bits").innerHTML="";
    bits.forEach((b,i)=>{
      const v=128>>i,btn=document.createElement("button");
      btn.className="bit"+(b?" on":"");btn.innerHTML=`<small>${v}</small><b>${b}</b>`;
      btn.setAttribute("aria-label","Bit worth "+v+", currently "+b);
      btn.onclick=()=>{bits[i]=1-bits[i];draw()};$("bits").append(btn);
    });
    const parts=bits.map((b,i)=>b?128>>i:0).filter(Boolean),sum=parts.reduce((a,b)=>a+b,0);
    $("dec").textContent=sum;
    $("eq").textContent=parts.length?parts.join(" + ")+" = "+sum:"All bits are off, so the value is 0.";
  };
  $("n").oninput=e=>{const v=Math.max(0,Math.min(255,parseInt(e.target.value)||0));bits=v.toString(2).padStart(8,"0").split("").map(Number);draw()};
  draw();
}

function recipe(el){
  el.innerHTML=`<h2>Recipe Scaler (Home Economics)</h2><p>Change the number of servings and every ingredient adjusts.</p>
  <div class="cols"><div><label for="o">Recipe makes</label><input id="o" type="number" min="1" value="4"></div><div><label for="d">You need</label><input id="d" type="number" min="1" value="10"></div></div>
  <label for="ing">Ingredients (one per line, start with the amount)</label><textarea id="ing">2 cups rice\n1/2 tsp salt\n1 1/2 tbsp cooking oil\n3 cloves garlic</textarea>
  <div class="out"><b>Scaled ingredients</b><ul id="res"></ul></div>`;
  const fmt=n=>String(Math.round(n*100)/100);
  const num=s=>{s=s.trim();let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
  const run=()=>{
    const f=(+$("d").value||0)/(+$("o").value||1);
    $("res").innerHTML=$("ing").value.split("\n").filter(l=>l.trim()).map(l=>{
      const m=l.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
      return "<li>"+(m?fmt(num(m[1])*f)+" "+m[2]:l)+"</li>";
    }).join("");
  };
  ["o","d","ing"].forEach(i=>$(i).oninput=run);run();
}

function measure(el){
  const U={mm:1,cm:10,m:1000,in:25.4,ft:304.8};
  const opts=k=>Object.keys(U).map(u=>`<option ${u===k?"selected":""}>${u}</option>`).join("");
  el.innerHTML=`<h2>Measurement Converter (Industrial Arts)</h2><p>Convert between metric and inch units before you cut.</p>
  <div class="cols"><div><label for="v">Value</label><input id="v" type="number" value="2.5" step="any"></div><div><label for="f">From</label><select id="f">${opts("m")}</select></div><div><label for="t">To</label><select id="t">${opts("cm")}</select></div></div>
  <div class="out"><div class="big" id="r"></div><div id="note"></div></div>`;
  const run=()=>{
    const mm=(+$("v").value||0)*U[$("f").value],r=mm/U[$("t").value];
    $("r").textContent=(Math.round(r*1000)/1000)+" "+$("t").value;
    $("note").textContent="That equals "+(Math.round(mm/25.4*100)/100)+" inches or "+(Math.round(mm/10*100)/100)+" cm.";
  };
  ["v","f","t"].forEach(i=>$(i).oninput=run);run();
}

function planting(el){
  el.innerHTML=`<h2>Planting Calculator (Agri-Fishery Arts)</h2><p>Estimate how many seedlings your garden plot needs.</p>
  <div class="cols"><div><label for="L">Plot length (m)</label><input id="L" type="number" value="10" min="1" step="any"></div><div><label for="W">Plot width (m)</label><input id="W" type="number" value="4" min="1" step="any"></div></div>
  <div class="cols"><div><label for="rs">Space between rows (cm)</label><input id="rs" type="number" value="50" min="5"></div><div><label for="ps">Space between plants (cm)</label><input id="ps" type="number" value="30" min="5"></div></div>
  <div class="out"><div class="big" id="tot"></div><div id="det"></div></div>`;
  const run=()=>{
    const rows=Math.floor(($("W").value*100)/($("rs").value||1)),per=Math.floor(($("L").value*100)/($("ps").value||1));
    $("tot").textContent=(rows*per)+" seedlings";
    $("det").textContent=rows+" rows with "+per+" plants per row on a "+($("L").value*$("W").value)+" square meter plot.";
  };
  ["L","W","rs","ps"].forEach(i=>$(i).oninput=run);run();
}

const LAB3D=(()=>{
const PI=Math.PI,D=PI/180;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgbOf=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mixHex=(a,b,t)=>{const x=rgbOf(a),y=rgbOf(b);return"#"+[0,1,2].map(i=>Math.round(x[i]+(y[i]-x[i])*t).toString(16).padStart(2,"0")).join("")};

/* ---------- 3D shape helpers (faces are {v:[points],c:hex,b:depthBias}) ---------- */
function box(cx,cy,cz,w,h,d,c,cb,b){const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2,B=b||0;return[
 {v:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c,b:B},{v:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],c:cb||c,b:B},
 {v:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],c,b:B},{v:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],c,b:B},
 {v:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],c,b:B},{v:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],c,b:B}]}
function prism(p0,p1,r0,r1,n,c,c2){const a=norm(sub(p1,p0)),h=Math.abs(a[1])<.9?[0,1,0]:[1,0,0],u=norm(cross(a,h)),v=cross(a,u);
 const ring=(p,r)=>Array.from({length:n},(_,i)=>{const t=i/n*2*PI;return add(p,add(mul(u,r*Math.cos(t)),mul(v,r*Math.sin(t))))});
 const A=ring(p0,r0),B=ring(p1,r1),f=[];for(let i=0;i<n;i++){const j=(i+1)%n;f.push({v:[A[i],A[j],B[j],B[i]],c})}
 f.push({v:A,c:c2||c},{v:B,c:c2||c});return f}
function ell(c,rx,ry,rz,col,n=8,m=5){const Q=(i,j)=>{const th=i/m*PI,ph=j/n*2*PI;return[c[0]+rx*Math.sin(th)*Math.cos(ph),c[1]+ry*Math.cos(th),c[2]+rz*Math.sin(th)*Math.sin(ph)]},f=[];for(let i=0;i<m;i++)for(let j=0;j<n;j++)f.push({v:[Q(i,j),Q(i,j+1),Q(i+1,j+1),Q(i+1,j)],c:col});return f}
function loft(secs,n,col,colB,p=.55){const ring=s=>Array.from({length:n},(_,i)=>{const t=i/n*2*PI,c=Math.cos(t),z=Math.sin(t);return[(s.x||0)+s.w/2*Math.sign(c)*Math.pow(Math.abs(c),p),(s.y||0)+s.h/2*Math.sign(z)*Math.pow(Math.abs(z),p),s.z]});
 const R=secs.map(ring),f=[];for(let a=0;a<R.length-1;a++)for(let i=0;i<n;i++){const j=(i+1)%n;f.push({v:[R[a][i],R[a][j],R[a+1][j],R[a+1][i]],c:Math.sin((i+.5)/n*2*PI)<0?(colB||col):col})}
 f.push({v:R[0],c:col},{v:R[R.length-1],c:col});return f}
function slab(p0,p1,w0,w1,h,c){const d=norm(sub(p1,p0)),u=norm(cross(d,[0,1,0])),up=[0,h/2,0];const q=(p,w,sg,sv)=>add(add(p,mul(u,w/2*sg)),mul(up,sv));
 const A=[q(p0,w0,-1,1),q(p0,w0,1,1),q(p1,w1,1,1),q(p1,w1,-1,1)],B=[q(p0,w0,-1,-1),q(p0,w0,1,-1),q(p1,w1,1,-1),q(p1,w1,-1,-1)];
 return[{v:A,c},{v:B,c},{v:[A[0],A[1],B[1],B[0]],c},{v:[A[1],A[2],B[2],B[1]],c},{v:[A[2],A[3],B[3],B[2]],c},{v:[A[3],A[0],B[0],B[3]],c}]}
function extrude(pts,y0,y1,c){const T=pts.map(p=>[p[0],y1,p[1]]),B=pts.map(p=>[p[0],y0,p[1]]),f=[{v:T,c},{v:B,c}];for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;f.push({v:[B[i],B[j],T[j],T[i]],c})}return f}
const quad=(y,x0,z0,x1,z1,c,b)=>({v:[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],c,b:b||0});
const mapF=(faces,fn)=>faces.map(f=>({...f,v:f.v.map(fn)}));
const circ=(x,z,r)=>Array.from({length:25},(_,i)=>[x+r*Math.cos(i/24*2*PI),z+r*Math.sin(i/24*2*PI)]);
const ellp=(cx,y,cz,rx,rz)=>Array.from({length:33},(_,i)=>[cx+rx*Math.cos(i/32*2*PI),y,cz+rz*Math.sin(i/32*2*PI)]);

/* ================= the shared studio engine ================= */
function studio(el,cfg){
const TASKS=cfg.tasks,TOOLS=cfg.tools,LES=cfg.lessons,SLOTS=cfg.slots,PLACED=cfg.placed,N=TASKS.length,tdef=id=>TOOLS.find(t=>t.id===id);
let P;try{P=JSON.parse(localStorage.getItem(cfg.key))||{}}catch(e){P={}}P.d=P.d||{};P.fl=P.fl||0;
const savep=()=>{try{localStorage.setItem(cfg.key,JSON.stringify(P))}catch(e){}};
const S={mode:"learn",step:0,level:1,skin:cfg.skin?1:0,sel:null,info:null};
let body=cfg.build(S.skin),tools=[],run=null,drag=null,down=null,camDrag=null,hov=null,raf=0,path=null,camS=null,hang=0,hT=0;
const CP=cfg.camP;let cam={yaw:0,pitch:CP.pitch,dist:CP.dist},camT={...cam},tg=CP.tg.slice(),tgT=CP.tg.slice();
const ACC="#0f766e",RING="#f59e0b";

el.innerHTML=`<h2>${cfg.title}</h2><p>${cfg.intro}</p>
<div class="hm-top"><button class="hm-tab" data-m="learn">1. Learn the steps</button><button class="hm-tab" data-m="practice">2. Practice with tools</button></div>
<div class="hm"><div><canvas id="hmc" role="img" aria-label="${cfg.title} 3D scene"></canvas>
<div class="hm-ctl">${cfg.flip?'<button class="btn alt" id="hflip">Flip hand</button>':''}<button class="btn alt" id="hzin">Zoom +</button><button class="btn alt" id="hzout">Zoom −</button><button class="btn alt" id="hreset">Reset view</button>${cfg.skin?'<label class="hm-skin">Skin tone <select id="skin"><option value="0">Light</option><option value="1" selected>Medium</option><option value="2">Deep</option></select></label>':''}</div>
<p class="hm-hint">Drag empty space to rotate the view. Tap a tool to see its name. On a phone you can also tap a tool, then tap where it goes.</p></div>
<div class="hm-side" id="hside"></div></div>`;
const cv=el.querySelector("#hmc"),ctx=cv.getContext("2d"),side=el.querySelector("#hside");

const makeTools=shuf=>{const order=SLOTS.map((_,i)=>i);if(shuf)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}

 {t:"Prepare fabric and pattern",y:FY,cam:[0,1.1,11],tg:[0,.1,1.2],col:"#16a34a",strokes:[[[0,-.1],[0,2.7]],[[-1.5,.1],[1.5,.1],[1.5,2.3],[-1.5,2.3],[-1.5,.1]]],pts:["Check the fabric label. Wash and press the fabric first if it can shrink.","Straighten the fabric so the lengthwise grain runs parallel to the edge (selvage).","Place the pattern pieces on the fabric. Match each grainline arrow to the grain.","Keep the fabric flat on a clean table."],chips:[["Grain","Along the selvage"],["Check","Before you cut"]],tip:"Never cut until the pattern pieces are placed and checked."},
